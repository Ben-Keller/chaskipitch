<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Edit Lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>Text Edit Lab</h1>
        <p>Edit `new_text` and click <strong>Save + Next</strong>. Changes are written to JSON on each save.</p>
      </header>

      <section class="status-panel">
        <p id="progress-line">Loading...</p>
        <p id="summary-line" class="note"></p>
        <p id="output-line" class="note"></p>
      </section>

      <section id="workspace" class="workspace hidden">
        <article class="card editor-card">
          <p id="entry-id" class="mono"></p>
          <p id="entry-file" class="mono"></p>
          <p id="entry-locator" class="mono"></p>

          <div class="text-block">
            <label for="original-text">Original text</label>
            <textarea id="original-text" readonly></textarea>
          </div>

          <div class="text-block">
            <label for="editable-text">Editable `new_text`</label>
            <textarea id="editable-text" spellcheck="true"></textarea>
          </div>

          <p id="dirty-line" class="note"></p>

          <div class="actions">
            <button id="prev-btn" type="button">Previous</button>
            <button id="save-next-btn" type="button">Save + Next</button>
          </div>
        </article>
      </section>

      <section id="error-panel" class="error hidden"></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theme Texture Lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>Theme Texture Lab</h1>
        <p>Pair each thematic with one texture from the full texture set.</p>
      </header>

      <section class="status-panel">
        <p id="progress-line">Loading...</p>
        <p id="output-line" class="note"></p>
      </section>

      <section id="workspace" class="workspace hidden">
        <aside class="theme-column card">
          <div class="theme-column__head">
            <h2>Thematics</h2>
            <div class="theme-column__actions">
              <button id="prev-btn" type="button">Previous</button>
              <button id="save-next-btn" type="button">Save + Next</button>
            </div>
          </div>
          <div id="theme-list" class="theme-list" aria-label="Theme list"></div>
        </aside>

        <section class="texture-column">
          <article class="card current-card">
            <h2 id="current-theme-name">Theme</h2>
            <p id="current-theme-slug" class="mono"></p>
            <p id="current-mapping-line" class="note"></p>
            <p id="saved-mapping-line" class="note"></p>
            <p id="draft-mapping-line" class="note"></p>
          </article>

          <article class="card">
            <div class="texture-head">
              <h2>Textures</h2>
              <label>
                <span>Search</span>
                <input id="texture-search" type="search" placeholder="Search texture file names" />
              </label>
            </div>
            <p id="texture-count-line" class="note"></p>
            <div id="texture-grid" class="texture-grid"></div>
          </article>
        </section>
      </section>

      <section id="error-panel" class="error hidden"></section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
